<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cofre | Organizador financeiro pessoal</title>
<meta name="description" content="Controle seus gastos, renda e metas financeiras de forma simples e rápida." />
<!-- O TÍTULO É IGUAL AO DA LANDING DE PROPÓSITO (ver tests/test-beta-fixes.js,
     F-11): o aplicativo já se chamou "Finanças" enquanto a landing se chamava
     "Cofre", e quem clicava em "Começar grátis" chegava ao que parecia outro
     produto. O efeito colateral seria título repetido na busca. A saída não é
     renomear: sem JavaScript executado e sem dados do usuário, esta página é um
     esqueleto de carregamento e não tem o que indexar. A landing continua sendo
     a única porta indexada, e `follow` mantém o rastreio dos links que saem
     daqui. Ver docs/MARCA.md. -->
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#EFF2F0" />
<meta name="color-scheme" content="light dark" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cofre" />
<script src="js/boot.js"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dynamic.css" data-dynamic-styles />
</head>
<body>
<div id="app">
  <main class="main-content" id="conteudo" tabindex="-1">
    <div class="screen" aria-busy="true" aria-label="Carregando seus dados">
      <div class="screen-header">
        <div class="dash-greeting">
          <div class="sk sk--line sk--w120"></div>
          <div class="sk sk--title"></div>
        </div>
      </div>
      <div class="grid-dashboard">
        <div class="card card--hero span-3 sk-card">
          <div class="sk sk--line sk--w90"></div>
          <div class="sk sk--hero"></div>
          <div class="sk-row"><div class="sk sk--chip"></div><div class="sk sk--chip"></div><div class="sk sk--chip"></div></div>
        </div>
        <div class="card span-1 sk-card"><div class="sk sk--line sk--w120"></div><div class="sk sk--ring"></div></div>
        <div class="card span-2 sk-card"><div class="sk sk--line sk--w120"></div><div class="sk sk--line"></div><div class="sk sk--line sk--w70"></div><div class="sk sk--bar"></div></div>
        <div class="card span-1 sk-card"><div class="sk sk--line sk--w90"></div><div class="sk sk--line"></div><div class="sk sk--line sk--w70"></div></div>
        <div class="card span-2 sk-card"><div class="sk sk--line sk--w120"></div><div class="sk sk--line"></div><div class="sk sk--line"></div><div class="sk sk--line sk--w70"></div></div>
      </div>
    </div>
  </main>
  <noscript>Este app precisa de JavaScript habilitado para funcionar.</noscript>
</div>

<script type="module" src="js/modules/bootstrap.js"></script>

</body>
</html>
